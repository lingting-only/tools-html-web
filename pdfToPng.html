
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 转图片专业版 - 独立运行版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
      body {
        font-family: 'Inter', 'Noto Sans SC', sans-serif;
        background-color: #f8fafc;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
      import React, { useState, useRef, useCallback, useEffect } from 'https://esm.sh/react@18.2.0';
      import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
      import htm from 'https://esm.sh/htm@3.1.1';
      import * as Lucide from 'https://esm.sh/lucide-react@0.263.1';
      import JSZip from 'https://esm.sh/jszip@3.10.1';

      const html = htm.bind(React.createElement);

      // Enums & Types
      const AppStatus = {
        IDLE: 'IDLE',
        PROCESSING: 'PROCESSING',
        COMPLETED: 'COMPLETED',
        ERROR: 'ERROR'
      };

      // Setup PDF.js worker
      window['pdfjs-dist/build/pdf'].GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdfjsLib = window['pdfjs-dist/build/pdf'];

      function App() {
        const [status, setStatus] = useState(AppStatus.IDLE);
        const [errorMessage, setErrorMessage] = useState(null);
        const [images, setImages] = useState([]);
        const [fileName, setFileName] = useState('');
        const [progress, setProgress] = useState(0);
        const [pdfFile, setPdfFile] = useState(null);
        const [isCustomScale, setIsCustomScale] = useState(false);
        const [settings, setSettings] = useState({
          scale: 2.0,
          format: 'image/png',
          quality: 0.95
        });

        const fileInputRef = useRef(null);

        const convertPdfToImages = async (file, currentSettings) => {
          try {
            setStatus(AppStatus.PROCESSING);
            setErrorMessage(null);
            setImages([]);
            setProgress(0);
            setFileName(file.name.replace(/\.[^/.]+$/, ""));

            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const totalPages = pdf.numPages;
            const convertedImages = [];

            for (let i = 1; i <= totalPages; i++) {
              const page = await pdf.getPage(i);
              const viewport = page.getViewport({ scale: currentSettings.scale });
              
              const canvas = document.createElement('canvas');
              const context = canvas.getContext('2d');
              if (!context) throw new Error('无法获取 Canvas 上下文');

              canvas.height = viewport.height;
              canvas.width = viewport.width;

              const renderContext = {
                canvasContext: context,
                viewport: viewport,
              };

              await page.render(renderContext).promise;

              const dataUrl = canvas.toDataURL(currentSettings.format, currentSettings.quality);
              
              const blob = await new Promise((resolve) => {
                canvas.toBlob((b) => resolve(b), currentSettings.format, currentSettings.quality);
              });

              convertedImages.push({
                id: i,
                pageNumber: i,
                dataUrl,
                blob,
                width: Math.round(viewport.width),
                height: Math.round(viewport.height)
              });

              setProgress(Math.round((i / totalPages) * 100));
              setImages([...convertedImages]);
            }

            setStatus(AppStatus.COMPLETED);
          } catch (error) {
            console.error('PDF Conversion Error:', error);
            setStatus(AppStatus.ERROR);
            setErrorMessage('处理 PDF 失败。请确保文件有效且未加密。');
          }
        };

        const handleFileUpload = (e) => {
          const file = e.target.files?.[0];
          if (file && file.type === 'application/pdf') {
            setPdfFile(file);
            convertPdfToImages(file, settings);
          } else if (file) {
            setStatus(AppStatus.ERROR);
            setErrorMessage('请上传有效的 PDF 文件。');
          }
        };

        const handleDragOver = (e) => e.preventDefault();
        const handleDrop = (e) => {
          e.preventDefault();
          const file = e.dataTransfer.files?.[0];
          if (file && file.type === 'application/pdf') {
            setPdfFile(file);
            convertPdfToImages(file, settings);
          }
        };

        const reProcess = () => pdfFile && convertPdfToImages(pdfFile, settings);

        const downloadAllAsZip = async () => {
          if (images.length === 0) return;
          const zip = new JSZip();
          const folder = zip.folder(`${fileName}_图片导出`);
          images.forEach((img) => {
            const ext = settings.format.split('/')[1];
            folder.file(`第${img.pageNumber}页.${ext}`, img.blob);
          });
          const content = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(content);
          const link = document.createElement('a');
          link.href = url;
          link.download = `${fileName}_全部图片.zip`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        };

        const reset = () => {
          setStatus(AppStatus.IDLE);
          setImages([]);
          setFileName('');
          setProgress(0);
          setPdfFile(null);
          setErrorMessage(null);
        };

        const handleScaleChange = (val) => {
          if (val === 'custom') {
            setIsCustomScale(true);
          } else {
            setIsCustomScale(false);
            setSettings({ ...settings, scale: parseFloat(val) });
          }
        };

        return html`
          <div className="min-h-screen flex flex-col">
            <header className="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-30 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="bg-indigo-600 p-2 rounded-lg text-white">
                  <${Lucide.ImageIcon} size=${20} />
                </div>
                <h1 className="text-xl font-bold text-slate-800 tracking-tight">PDF 转图片专业版</h1>
              </div>
              <div className="flex items-center gap-4">
                ${images.length > 0 && html`
                  <button onClick=${reset} className="text-slate-500 hover:text-red-600 transition-colors p-2 rounded-full hover:bg-red-50" title="清除全部">
                    <${Lucide.Trash2} size=${20} />
                  </button>
                `}
                <a href="#" className="text-slate-400 hover:text-slate-600 transition-colors">
                  <i className="fab fa-github text-xl"></i>
                </a>
              </div>
            </header>

            <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">
              ${(status === AppStatus.IDLE || status === AppStatus.ERROR) && html`
                <div 
                  className=${`bg-white border-2 border-dashed rounded-2xl p-12 transition-all flex flex-col items-center justify-center gap-6 cursor-pointer ${status === AppStatus.ERROR ? 'border-red-200 bg-red-50/30' : 'border-slate-200 hover:border-indigo-400 hover:bg-slate-50/50'}`}
                  onDragOver=${handleDragOver}
                  onDrop=${handleDrop}
                  onClick=${() => fileInputRef.current?.click()}
                >
                  <input type="file" ref=${fileInputRef} onChange=${handleFileUpload} accept="application/pdf" className="hidden" />
                  <div className=${`p-5 rounded-full ${status === AppStatus.ERROR ? 'bg-red-100 text-red-600' : 'bg-indigo-100 text-indigo-600'}`}>
                    <${Lucide.FileUp} size=${48} />
                  </div>
                  <div className="text-center">
                    <h3 className="text-xl font-semibold text-slate-800">${status === AppStatus.ERROR ? '操作出错了' : '点击或拖拽 PDF 文件至此'}</h3>
                    <p className="text-slate-500 mt-2 max-w-sm">${errorMessage || '安全地将您的 PDF 页面转换为高分辨率的 PNG 或 JPEG 图片。'}</p>
                  </div>
                  <button className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-8 py-3 rounded-xl transition-all shadow-lg shadow-indigo-100">选择 PDF 文件</button>
                </div>
              `}

              ${(status === AppStatus.PROCESSING || status === AppStatus.COMPLETED) && html`
                <div className="bg-white border border-slate-200 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center gap-4 flex-1 min-w-[300px]">
                    <${Lucide.Settings} size=${20} className="text-slate-400" />
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-medium text-slate-600">分辨率:</span>
                      <select 
                        value=${isCustomScale ? 'custom' : settings.scale}
                        onChange=${(e) => handleScaleChange(e.target.value)}
                        disabled=${status === AppStatus.PROCESSING}
                        className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg p-1.5 outline-none"
                      >
                        <option value="1.0">标准 (1x)</option>
                        <option value="2.0">高清 (2x)</option>
                        <option value="3.0">超清 (3x)</option>
                        <option value="custom">自定义</option>
                      </select>
                      ${isCustomScale && html`
                        <div className="flex items-center gap-1">
                          <input type="number" min="0.1" max="10" step="0.1" value=${settings.scale} onChange=${(e) => setSettings({ ...settings, scale: parseFloat(e.target.value) || 1.0 })} className="w-16 bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg p-1.5 outline-none" />
                        </div>
                      `}
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-medium text-slate-600">格式:</span>
                      <select value=${settings.format} onChange=${(e) => setSettings({...settings, format: e.target.value})} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg p-1.5 outline-none">
                        <option value="image/png">PNG</option>
                        <option value="image/jpeg">JPEG</option>
                      </select>
                    </div>
                    ${status === AppStatus.COMPLETED && html`
                      <button onClick=${reProcess} className="text-indigo-600 hover:text-indigo-700 p-2 rounded-lg hover:bg-indigo-50 transition-colors" title="重新渲染">
                        <${Lucide.RefreshCw} size=${18} />
                      </button>
                    `}
                  </div>

                  <div className="flex items-center gap-3">
                    ${status === AppStatus.COMPLETED && html`
                      <button onClick=${downloadAllAsZip} className="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg flex items-center gap-2 transition-all shadow-md">
                        <${Lucide.FileArchive} size=${18} /> 一键保存所有图片 (ZIP)
                      </button>
                    `}
                    ${status === AppStatus.PROCESSING && html`
                      <div className="flex items-center gap-3 px-4 py-2 bg-slate-100 rounded-lg text-slate-600 font-medium">
                        <${Lucide.Loader2} size=${18} className="animate-spin text-indigo-500" /> 渲染中 ${progress}%
                      </div>
                    `}
                  </div>
                </div>
              `}

              ${images.length > 0 && html`
                <div className="space-y-4">
                  <h2 className="text-lg font-semibold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-4">
                    已处理页面 <span className="bg-slate-200 text-slate-600 text-xs px-2 py-0.5 rounded-full">共 ${images.length} 页</span>
                  </h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-12">
                    ${images.map((img) => html`
                      <div key=${img.id} className="group bg-white border border-slate-200 rounded-xl overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                        <div className="aspect-[3/4] overflow-hidden bg-slate-100 relative">
                          <img src=${img.dataUrl} className="w-full h-full object-contain" loading="lazy" />
                          <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                             <a href=${img.dataUrl} download=${`${fileName}_第${img.pageNumber}页.${settings.format.split('/')[1]}`} className="bg-white/90 hover:bg-white text-slate-900 font-medium px-4 py-2 rounded-lg flex items-center gap-2 shadow-lg">
                               <${Lucide.Download} size=${16} /> 保存图片
                             </a>
                          </div>
                        </div>
                        <div className="p-4 flex items-center justify-between bg-white">
                          <div className="flex flex-col">
                            <span className="text-sm font-semibold text-slate-800">第 ${img.pageNumber} 页</span>
                            <span className="text-xs text-slate-400 uppercase">${img.width}x${img.height} 像素</span>
                          </div>
                          <div className="h-6 w-6 bg-green-50 text-green-600 rounded-full flex items-center justify-center">
                            <${Lucide.CheckCircle} size=${14} />
                          </div>
                        </div>
                      </div>
                    `)}
                  </div>
                </div>
              `}
            </main>

            <footer className="bg-slate-50 border-t border-slate-200 p-8">
              <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 text-sm text-slate-500">
                <div><h4 className="font-semibold text-slate-800">私密与安全</h4><p>您的文件完全在浏览器本地处理，绝不上传服务器。</p></div>
                <div><h4 className="font-semibold text-slate-800">批量导出</h4><p>支持一键打包所有生成的图片为 ZIP 格式。</p></div>
                <div><h4 className="font-semibold text-slate-800">超清转换</h4><p>支持自定义 1x-10x 的缩放比例，满足打印级清晰度需求。</p></div>
              </div>
            </footer>
          </div>
        `;
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(html`<${App} />`);
    </script>
</body>
</html>
