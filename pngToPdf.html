
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap2PDF Pro - 图片转PDF工具</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; overflow: hidden; height: 100vh; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .watermark-overlay { pointer-events: none; user-select: none; }
        /* 容器查询，用于水印比例预览 */
        .preview-container { container-type: size; }
    </style>
    <!-- 配置导入映射，以便在原生浏览器中使用 ESM -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "htm": "https://esm.sh/htm@3.1.1",
        "jspdf": "https://esm.sh/jspdf@2.5.1",
        "lucide-react": "https://esm.sh/lucide-react@0.463.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState, useRef, useEffect, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import htm from 'htm';
        import { jsPDF } from 'jspdf';
        import * as Lucide from 'lucide-react';

        // 初始化 htm 绑定 React
        const html = htm.bind(React.createElement);

        /**
         * 核心处理：使用 Canvas 在导出前预处理所有的变换及水印
         */
        const processImageForPdf = async (img, pageWidth, pageHeight, settings) => {
            const canvas = document.createElement('canvas');
            const scaleFactor = 4; // 提高分辨率
            canvas.width = pageWidth * scaleFactor;
            canvas.height = pageHeight * scaleFactor;
            const ctx = canvas.getContext('2d');
            const margin = settings.margin;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const imgEl = await new Promise((resolve, reject) => {
                const e = new Image();
                e.crossOrigin = "anonymous";
                e.onload = () => resolve(e);
                e.onerror = reject;
                e.src = img.previewUrl;
            });

            const avW = (pageWidth - margin * 2) * scaleFactor;
            const avH = (pageHeight - margin * 2) * scaleFactor;
            const marginPx = margin * scaleFactor;

            let fw = 0, fh = 0;
            if (img.settings.fitMode === 'contain') {
                const r = Math.min(avW / imgEl.width, avH / imgEl.height);
                fw = imgEl.width * r; fh = imgEl.height * r;
            } else if (img.settings.fitMode === 'cover') {
                const r = Math.max(avW / imgEl.width, avH / imgEl.height);
                fw = imgEl.width * r; fh = imgEl.height * r;
            } else {
                fw = avW; fh = avH;
            }

            fw *= (img.settings.scale / 100);
            fh *= (img.settings.scale / 100);

            ctx.save();
            const centerX = marginPx + avW / 2 + (img.settings.offsetX * (scaleFactor / 3.78));
            const centerY = marginPx + avH / 2 + (img.settings.offsetY * (scaleFactor / 3.78));
            ctx.translate(centerX, centerY);
            ctx.rotate((img.settings.rotation * Math.PI) / 180);
            ctx.drawImage(imgEl, -fw / 2, -fh / 2, fw, fh);
            ctx.restore();

            // 绘制水印
            if (settings.watermark && settings.watermark.text) {
                ctx.save();
                let waterY = canvas.height * 0.5;
                if (settings.watermark.position === 'top') waterY = canvas.height * 0.15;
                else if (settings.watermark.position === 'bottom') waterY = canvas.height * 0.85;
                
                ctx.translate(canvas.width / 2, waterY);
                ctx.rotate(-15 * Math.PI / 180); 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = settings.watermark.color || '#cccccc';
                ctx.globalAlpha = settings.watermark.opacity || 0.3;
                
                // 使用相对于页面高度的比例计算字体大小，确保缩放一致
                // 假设输入 40 是在 800px 高度下的视觉大小 -> 比例约为 5%
                const fontSize = (settings.watermark.fontSize / 800) * canvas.height;
                ctx.font = `bold ${fontSize}px Inter, sans-serif`;
                
                ctx.fillText(settings.watermark.text, 0, 0);
                ctx.restore();
            }

            return canvas.toDataURL('image/jpeg', 0.9);
        };

        const createPdf = async (images, settings, onProgress) => {
            const doc = new jsPDF({
                orientation: settings.orientation,
                unit: 'mm',
                format: settings.pageSize === 'original' ? 'a4' : settings.pageSize
            });

            for (let i = 0; i < images.length; i++) {
                if (i > 0) doc.addPage();
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                const processedImgData = await processImageForPdf(images[i], pageWidth, pageHeight, settings);
                doc.addImage(processedImgData, 'JPEG', 0, 0, pageWidth, pageHeight, undefined, 'FAST');
                onProgress(Math.round(((i + 1) / images.length) * 100));
            }
            return doc.output('blob');
        };

        const Icon = ({ name, className }) => React.createElement(Lucide[name], { className });

        const App = () => {
            const [images, setImages] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const [status, setStatus] = useState('IDLE');
            const [progress, setProgress] = useState(0);
            const [filename, setFilename] = useState("我的文档.pdf");
            const [settings, setSettings] = useState({ 
                pageSize: 'a4', 
                orientation: 'portrait', 
                margin: 10,
                watermark: {
                    text: '',
                    fontSize: 40,
                    color: '#94a3b8',
                    opacity: 0.3,
                    position: 'bottom'
                }
            });

            const fileInput = useRef(null);
            const selectedImg = images.find(i => i.id === selectedId);

            const onUpload = (e) => {
                const files = Array.from(e.target.files || []);
                const newImgs = files.map(file => ({
                    id: Math.random().toString(36).substr(2, 9),
                    file, name: file.name, size: file.size,
                    previewUrl: URL.createObjectURL(file),
                    settings: { scale: 100, rotation: 0, fitMode: 'contain', offsetX: 0, offsetY: 0 }
                }));
                setImages(prev => [...prev, ...newImgs]);
                if (!selectedId && newImgs.length > 0) setSelectedId(newImgs[0].id);
            };

            const updateImg = (id, s) => {
                setImages(prev => prev.map(i => i.id === id ? { ...i, settings: { ...i.settings, ...s } } : i));
            };

            const updateWatermark = (w) => {
                setSettings(prev => ({ ...prev, watermark: { ...prev.watermark, ...w } }));
            };

            const handleExport = async () => {
                if (images.length === 0) return;
                setStatus('EXPORTING');
                setProgress(0);
                try {
                    const blob = await createPdf(images, settings, setProgress);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename.toLowerCase().endsWith('.pdf') ? filename : `${filename}.pdf`;
                    a.click();
                    setStatus('SUCCESS');
                    setTimeout(() => setStatus('IDLE'), 3000);
                } catch (e) { 
                    console.error(e);
                    setStatus('ERROR'); 
                }
            };

            return html`
                <div className="flex flex-col h-screen overflow-hidden">
                    <header className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm z-10">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 p-2 rounded-xl text-white shadow-lg">
                                <${Icon} name="FileImage" className="w-5 h-5" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-slate-800">Snap2PDF Pro</h1>
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">单文件独立版 • 导出排版已修复</p>
                            </div>
                        </div>
                        <button 
                            onClick=${handleExport}
                            disabled=${images.length === 0 || status === 'EXPORTING'}
                            className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white px-6 py-2 rounded-xl font-bold flex items-center gap-2 transition-all shadow-md active:scale-95"
                        >
                            ${status === 'EXPORTING' ? html`<${Icon} name="Loader2" className="w-4 h-4 animate-spin" />` : html`<${Icon} name="Download" className="w-4 h-4" />`}
                            ${status === 'EXPORTING' ? `${progress}%` : '导出 PDF'}
                        </button>
                    </header>

                    <main className="flex-1 flex overflow-hidden">
                        <!-- 左边栏 -->
                        <aside className="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0">
                            <div className="p-4 border-b flex justify-between items-center bg-slate-50/50">
                                <span className="text-xs font-black text-slate-400 uppercase">图片队列 (${images.length})</span>
                                <button onClick=${() => fileInput.current.click()} className="text-indigo-600 hover:bg-indigo-50 p-1.5 rounded-lg transition-colors"><${Icon} name="Plus" className="w-5 h-5" /></button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar">
                                ${images.length === 0 ? html`
                                    <div onClick=${() => fileInput.current.click()} className="h-64 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center text-slate-300 gap-2 m-2 cursor-pointer hover:bg-slate-50 transition-colors">
                                        <${Icon} name="Plus" className="w-8 h-8 opacity-20" />
                                        <p className="text-[10px] font-bold uppercase tracking-tight">点击添加图片</p>
                                    </div>
                                ` : images.map((img, idx) => html`
                                    <div key=${img.id} onClick=${() => setSelectedId(img.id)} className=${`group p-2 rounded-2xl border-2 cursor-pointer flex gap-3 items-center transition-all ${selectedId === img.id ? 'bg-indigo-50 border-indigo-500 shadow-sm' : 'bg-white border-transparent hover:border-slate-100'}`}>
                                        <div className="w-12 h-16 rounded-lg bg-slate-100 border overflow-hidden shrink-0">
                                            <img src=${img.previewUrl} className="w-full h-full object-cover" />
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <p className="text-[10px] font-bold truncate text-slate-700">${img.name}</p>
                                            <p className="text-[9px] text-slate-400 mt-1 uppercase tracking-tighter font-mono">P${idx + 1}</p>
                                        </div>
                                        <button onClick=${(e) => { e.stopPropagation(); setImages(prev => prev.filter(i => i.id !== img.id)); }} className="opacity-0 group-hover:opacity-100 p-1.5 text-red-500 hover:bg-red-50 rounded-lg transition-all"><${Icon} name="Trash2" className="w-4 h-4" /></button>
                                    </div>
                                `)}
                            </div>
                            <input type="file" multiple accept="image/*" onChange=${onUpload} ref=${fileInput} className="hidden" />
                        </aside>

                        <!-- 中间画布：预览区 -->
                        <section className="flex-1 bg-slate-100 flex items-center justify-center relative p-8">
                            ${selectedImg ? html`
                                <div className="bg-white shadow-[0_20px_50px_rgba(0,0,0,0.1)] relative transition-all duration-300 overflow-hidden flex items-center justify-center border border-white preview-container" 
                                     style=${{ 
                                        width: settings.orientation === 'portrait' ? 'auto' : '85%', 
                                        height: settings.orientation === 'portrait' ? '90%' : 'auto', 
                                        aspectRatio: settings.pageSize === 'a4' ? (settings.orientation === 'portrait' ? '210/297' : '297/210') : '1/1',
                                        padding: `${settings.margin}px` 
                                     }}>
                                    <div className="relative w-full h-full flex items-center justify-center overflow-hidden bg-slate-50/50 rounded-sm">
                                        <div className="relative pointer-events-none" 
                                             style=${{
                                                width: selectedImg.settings.fitMode === 'stretch' ? '100%' : 'auto',
                                                height: selectedImg.settings.fitMode === 'stretch' ? '100%' : 'auto',
                                                maxWidth: '100%',
                                                maxHeight: '100%',
                                                transform: `rotate(${selectedImg.settings.rotation}deg) scale(${selectedImg.settings.scale / 100}) translate(${selectedImg.settings.offsetX}px, ${selectedImg.settings.offsetY}px)`,
                                                transition: 'transform 0.2s cubic-bezier(0.4, 0, 0.2, 1)'
                                             }}>
                                            <img src=${selectedImg.previewUrl} className=${selectedImg.settings.fitMode === 'cover' ? 'w-full h-full object-cover' : selectedImg.settings.fitMode === 'contain' ? 'max-w-full max-h-full object-contain' : 'w-full h-full'} />
                                        </div>
                                        
                                        <!-- 比例水印预览 -->
                                        ${settings.watermark.text && html`
                                            <div className=${`absolute inset-0 flex justify-center watermark-overlay ${settings.watermark.position === 'top' ? 'items-start pt-[15%]' : settings.watermark.position === 'bottom' ? 'items-end pb-[15%]' : 'items-center'}`} style=${{ opacity: settings.watermark.opacity }}>
                                                <span style=${{ 
                                                    color: settings.watermark.color, 
                                                    fontSize: `calc(${settings.watermark.fontSize} / 800 * 100cqh)`,
                                                    transform: 'rotate(-15deg)',
                                                    fontWeight: '900',
                                                    whiteSpace: 'nowrap'
                                                }}>${settings.watermark.text}</span>
                                            </div>
                                        `}
                                    </div>
                                    <div className="absolute top-2 left-2 text-[8px] font-mono text-slate-200 select-none uppercase tracking-widest">实时预览</div>
                                </div>
                            ` : html`
                                <div className="text-slate-300 flex flex-col items-center gap-4">
                                    <${Icon} name="Layout" className="w-16 h-16 opacity-10" />
                                    <p className="font-bold text-[10px] tracking-widest uppercase">在左侧选择图片预览排版</p>
                                </div>
                            `}
                        </section>

                        <!-- 右边栏 -->
                        <aside className="w-80 bg-white border-l border-slate-200 p-6 overflow-y-auto custom-scrollbar shadow-sm">
                            <div className="space-y-8 pb-10">
                                <div className="space-y-4">
                                    <h3 className="text-[10px] font-black text-slate-300 uppercase tracking-widest border-b pb-2">文档全局设置</h3>
                                    <div className="space-y-3">
                                        <label className="block text-[11px] font-bold text-slate-500">导出名称</label>
                                        <input value=${filename} onChange=${e => setFilename(e.target.value)} className="w-full text-xs p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-100 transition-all font-medium" />
                                        <div className="grid grid-cols-2 gap-2">
                                            <div className="space-y-1">
                                                <span className="text-[9px] font-bold text-slate-400 uppercase">尺寸</span>
                                                <select value=${settings.pageSize} onChange=${e => setSettings({...settings, pageSize: e.target.value})} className="w-full text-xs p-2 bg-slate-50 border rounded-xl outline-none font-medium">
                                                    <option value="a4">A4 纸张</option>
                                                    <option value="letter">信纸尺寸</option>
                                                    <option value="original">原始大小</option>
                                                </select>
                                            </div>
                                            <div className="space-y-1">
                                                <span className="text-[9px] font-bold text-slate-400 uppercase">方向</span>
                                                <select value=${settings.orientation} onChange=${e => setSettings({...settings, orientation: e.target.value})} className="w-full text-xs p-2 bg-slate-50 border rounded-xl outline-none font-medium">
                                                    <option value="portrait">纵向</option>
                                                    <option value="landscape">横向</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="pt-2">
                                            <div className="flex justify-between text-[11px] font-bold text-slate-500 mb-1">
                                                <span>页边距</span>
                                                <span className="text-indigo-600 font-mono">${settings.margin}mm</span>
                                            </div>
                                            <input type="range" min="0" max="50" value=${settings.margin} onChange=${e => setSettings({...settings, margin: parseInt(e.target.value)})} className="w-full h-1 bg-slate-100 rounded-lg appearance-none accent-indigo-600" />
                                        </div>
                                    </div>
                                </div>

                                ${selectedImg && html`
                                    <div className="space-y-6 pt-6 border-t animate-fade-in">
                                        <h3 className="text-[10px] font-black text-slate-300 uppercase tracking-widest border-b pb-2">当前页微调 (P${images.indexOf(selectedImg)+1})</h3>
                                        <div className="space-y-5">
                                            <div>
                                                <div className="flex justify-between text-[11px] font-bold text-slate-500 mb-2">
                                                    <span>缩放比例</span>
                                                    <span className="text-indigo-600 font-mono">${selectedImg.settings.scale}%</span>
                                                </div>
                                                <input type="range" min="10" max="300" value=${selectedImg.settings.scale} onChange=${e => updateImg(selectedImg.id, { scale: parseInt(e.target.value) })} className="w-full h-1 bg-slate-100 rounded-lg appearance-none accent-indigo-600" />
                                            </div>
                                            
                                            <div className="flex gap-1 bg-slate-50 p-1 rounded-2xl border">
                                                ${['contain', 'cover', 'stretch'].map(m => html`
                                                    <button key=${m} onClick=${() => updateImg(selectedImg.id, { fitMode: m })} className=${`flex-1 py-2 rounded-xl text-[10px] font-bold transition-all ${selectedImg.settings.fitMode === m ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                                        ${m === 'contain' ? '适应' : m === 'cover' ? '填充' : '拉伸'}
                                                    </button>
                                                `)}
                                            </div>

                                            <div className="flex items-center justify-between bg-slate-50 p-4 rounded-2xl border">
                                                <span className="text-[11px] font-bold text-slate-500">旋转</span>
                                                <div className="flex items-center gap-3">
                                                    <button onClick=${() => updateImg(selectedImg.id, { rotation: (selectedImg.settings.rotation - 90 + 360) % 360 })} className="p-2 bg-white border rounded-xl shadow-sm hover:text-indigo-600 active:scale-90 transition-all">
                                                        <${Icon} name="RotateCw" className="w-4 h-4 transform scale-x-[-1]" />
                                                    </button>
                                                    <span className="text-xs font-mono font-bold w-10 text-center">${selectedImg.settings.rotation}°</span>
                                                    <button onClick=${() => updateImg(selectedImg.id, { rotation: (selectedImg.settings.rotation + 90) % 360 })} className="p-2 bg-white border rounded-xl shadow-sm hover:text-indigo-600 active:scale-90 transition-all">
                                                        <${Icon} name="RotateCw" className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="space-y-1">
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase">X 偏移</span>
                                                    <input type="number" value=${selectedImg.settings.offsetX} onChange=${e => updateImg(selectedImg.id, { offsetX: parseInt(e.target.value) || 0 })} className="w-full text-xs p-2 bg-slate-50 border rounded-xl outline-none font-mono" />
                                                </div>
                                                <div className="space-y-1">
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase">Y 偏移</span>
                                                    <input type="number" value=${selectedImg.settings.offsetY} onChange=${e => updateImg(selectedImg.id, { offsetY: parseInt(e.target.value) || 0 })} className="w-full text-xs p-2 bg-slate-50 border rounded-xl outline-none font-mono" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `}

                                <div className="space-y-4 pt-6 border-t">
                                    <h3 className="text-[10px] font-black text-slate-300 uppercase tracking-widest border-b pb-2">水印设置</h3>
                                    <div className="space-y-4">
                                        <div className="space-y-1">
                                            <label className="block text-[11px] font-bold text-slate-500">水印文本内容</label>
                                            <input placeholder="输入水印文字..." value=${settings.watermark.text} onChange=${e => updateWatermark({ text: e.target.value })} className="w-full text-xs p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-100 transition-all" />
                                        </div>
                                        
                                        <div className="space-y-1">
                                            <label className="block text-[11px] font-bold text-slate-500">显示位置</label>
                                            <div className="flex gap-1 bg-slate-50 p-1 rounded-2xl border">
                                                ${['top', 'center', 'bottom'].map(pos => html`
                                                    <button key=${pos} onClick=${() => updateWatermark({ position: pos })} className=${`flex-1 py-2 rounded-xl text-[10px] font-bold transition-all ${settings.watermark.position === pos ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                                        ${pos === 'top' ? '顶部' : pos === 'center' ? '居中' : '底部'}
                                                    </button>
                                                `)}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="space-y-1">
                                                <label className="block text-[11px] font-bold text-slate-500">字体大小</label>
                                                <input type="number" value=${settings.watermark.fontSize} onChange=${e => updateWatermark({ fontSize: parseInt(e.target.value) || 0 })} className="w-full text-xs p-2 bg-slate-50 border rounded-xl outline-none font-mono" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="block text-[11px] font-bold text-slate-500">水印颜色</label>
                                                <div className="flex gap-2">
                                                    <input type="color" value=${settings.watermark.color} onChange=${e => updateWatermark({ color: e.target.value })} className="h-8 w-8 bg-transparent cursor-pointer p-0 border-0" />
                                                    <span className="text-[10px] font-mono self-center uppercase text-slate-400">${settings.watermark.color}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between text-[11px] font-bold text-slate-500 mb-1">
                                                <span>不透明度</span>
                                                <span className="text-indigo-600 font-mono">${Math.round(settings.watermark.opacity * 100)}%</span>
                                            </div>
                                            <input type="range" min="0" max="1" step="0.05" value=${settings.watermark.opacity} onChange=${e => updateWatermark({ opacity: parseFloat(e.target.value) })} className="w-full h-1 bg-slate-100 rounded-lg appearance-none accent-indigo-600" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </aside>
                    </main>

                    ${status === 'SUCCESS' && html`
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-green-600 text-white px-8 py-4 rounded-[2rem] shadow-2xl flex items-center gap-4 animate-fade-in z-50">
                            <div className="bg-white/20 p-2 rounded-full"><${Icon} name="Check" className="w-5 h-5" /></div>
                            <span className="font-black text-sm">PDF 导出成功！</span>
                        </div>
                    `}
                </div>
            `;
        };

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
